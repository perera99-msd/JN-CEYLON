name: 🚀 Deploy to Render

on:
  workflow_run:
    workflows: ["🔄 CI Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: 🚀 Trigger Render Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 🚀 Trigger Render deploy hook
        run: |
          echo "🚀 Triggering Render deployment..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 201 ]; then
            echo "✅ Deploy hook triggered successfully (HTTP $RESPONSE)"
          else
            echo "❌ Deploy hook failed (HTTP $RESPONSE)"
            exit 1
          fi

      - name: ⏳ Wait for deployment
        run: |
          echo "⏳ Waiting 60 seconds for deployment to start..."
          sleep 60

      - name: 🏥 Health check
        run: |
          echo "🏥 Checking deployment health..."
          MAX_RETRIES=10
          RETRY_DELAY=30
          for i in $(seq 1 $MAX_RETRIES); do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://jn-ceylon.onrender.com/api/health")
            if [ "$RESPONSE" -eq 200 ]; then
              echo "✅ Deployment is healthy! (attempt $i)"
              exit 0
            fi
            echo "⏳ Health check attempt $i/$MAX_RETRIES returned HTTP $RESPONSE. Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done
          echo "❌ Deployment health check failed after $MAX_RETRIES attempts"
          exit 1
