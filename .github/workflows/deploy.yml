name: 🚀 Deploy to Render

on:
  workflow_run:
    workflows: ["🔄 CI Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: 🚀 Trigger Render Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 🚀 Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "ℹ️ RENDER_DEPLOY_HOOK_URL secret is not configured in GitHub Secrets."
            echo "✅ Render is connected directly to this repo and deploys automatically upon push to main."
            exit 0
          fi
          echo "🚀 Triggering Render deployment hook..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || echo "000")
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 201 ]; then
            echo "✅ Deploy hook triggered successfully (HTTP $RESPONSE)"
          else
            echo "ℹ️ Deploy hook returned HTTP $RESPONSE. Render auto-deploy will continue via native git push."
          fi

      - name: 🏥 Live Site Health Check
        run: |
          echo "🏥 Verifying live site health..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://jn-ceylon.onrender.com/api/health" || echo "000")
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Live deployment is healthy and online (HTTP 200)!"
          else
            echo "ℹ️ Live site responded with HTTP $RESPONSE (may be spinning up on free tier)."
          fi
